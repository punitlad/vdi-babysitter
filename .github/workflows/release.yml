name: Release

run-name: >-
  ${{ github.event_name == 'push'
    && format('Stable release {0}', github.ref_name)
    || format('Dev release — {0}', github.event.workflow_run.display_title) }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dev-release:
    name: Dev release (latest-dev)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and sd
        run: |
          pip install build
          cargo install sd --locked

      - name: Inject git SHA for dev build
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sd \"dev\" \"${SHORT_SHA}\" vdi_babysitter/_version.py

      - name: Build sdist
        run: python -m build --sdist

      - name: Get tarball path and SHA256
        id: tarball
        run: |
          TARBALL=$(ls dist/*.tar.gz)
          SHA256=$(sha256sum $TARBALL | awk '{print $1}')
          echo "path=$TARBALL" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Update latest-dev GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev
          name: "Dev build (latest)"
          prerelease: true
          files: ${{ steps.tarball.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get GitHub archive SHA256
        id: archive
        run: |
          SHA256=$(curl -sL https://github.com/punitlad/vdi-babysitter/archive/refs/tags/latest-dev.tar.gz | sha256sum | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Update dev formula in homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/punitlad/homebrew-tap.git
          cd homebrew-tap
          sed -i "0,/sha256 \".*\"/s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/vdi-babysitter-dev.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vdi-babysitter-dev.rb
          git diff --cached --quiet || git commit -m "chore: update vdi-babysitter-dev sha256 [skip ci]"
          git push

  brew-install-test-dev:
    name: Brew install test (${{ matrix.runner }})
    needs: dev-release
    strategy:
      matrix:
        runner: [macos-latest]
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Github CDN to update
        run: |
          sleep 10

      - name: Tap and install vdi-babysitter-dev
        run: |
          brew tap punitlad/tap
          brew install punitlad/tap/vdi-babysitter-dev

      - name: Smoke test
        run: pipx run pytest test_smoke.py -v

  stable-release:
    name: Stable release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and sd
        run: |
          pip install build
          cargo install sd --locked

      - name: Clear dev SHA for stable build
        run: sd \"dev\" None vdi_babysitter/_version.py

      - name: Build sdist and wheel
        run: python -m build

      - name: Create stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update stable formula in homebrew-tap
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: vdi-babysitter
          homebrew-tap: punitlad/homebrew-tap
          base-branch: main
          commit-message: "chore: bump vdi-babysitter to {{version}}"
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  brew-install-test:
    name: Brew install test (${{ matrix.runner }})
    needs: stable-release
    strategy:
      matrix:
        runner: [macos-latest]
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Github CDN to update
        run: |
          sleep 10

      - name: Tap and install vdi-babysitter
        run: |
          brew tap punitlad/tap
          brew install punitlad/tap/vdi-babysitter

      - name: Smoke test
        run: pipx run pytest test_smoke.py -v